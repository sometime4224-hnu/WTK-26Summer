<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="not-honestly-title not-honestly-desc" shape-rendering="geometricPrecision">
  <title id="not-honestly-title">솔직하지 않게 의미 도식</title>
  <desc id="not-honestly-desc">한 사람의 진짜 속마음과 입 밖으로 말한 내용이 다르고 그 사이에 숨긴 내용이 있는 장면이다.</desc>
  <defs>
    <style>
      text{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#172033}
      .label{font-size:26px;font-weight:900}
      .small{font-size:20px;font-weight:800;fill:#526178}
      .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="800" height="520" rx="28" fill="#fff8fb"/>
  <rect x="38" y="32" width="724" height="67" rx="22" fill="#ffe4e6"/>
  <text x="400" y="76" text-anchor="middle" class="label"><tspan fill="#be123c">진짜 마음을 숨김</tspan> + 다르게 말함</text>

  <rect x="52" y="137" width="286" height="181" rx="23" fill="#fff" stroke="#f3a6b8" stroke-width="4"/>
  <g transform="translate(77 160)" aria-hidden="true">
    <path d="M18 31C5 21 0 14 0 7 0 2 4-2 9-2c4 0 7 2 9 6 2-4 5-6 9-6 5 0 9 4 9 9 0 7-5 14-18 24Z" fill="#f97386" stroke="#be123c" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <text x="195" y="190" text-anchor="middle" class="small">속마음</text>
  <text x="195" y="252" text-anchor="middle" class="label" fill="#be123c">오늘은 쉬고 싶어요</text>
  <text x="195" y="289" text-anchor="middle" class="small">진짜 생각</text>

  <path d="M338 228H462" class="line" stroke="#be123c" stroke-width="7" stroke-dasharray="7 10"/>
  <circle cx="400" cy="228" r="28" fill="#be123c"/>
  <text x="400" y="238" text-anchor="middle" style="font-family:Pretendard,'Noto Sans KR',sans-serif;font-size:30px;font-weight:900;fill:#fff">≠</text>

  <path d="M486 137h256c14 0 25 11 25 25v131c0 14-11 25-25 25H554l-116 47 34-47h14c-14 0-25-11-25-25V162c0-14 11-25 25-25Z" fill="#fff" stroke="#f3a6b8" stroke-width="4" stroke-linejoin="round"/>
  <text x="614" y="190" text-anchor="middle" class="small">말한 내용</text>
  <text x="614" y="252" text-anchor="middle" class="label" fill="#9f1239">저는 괜찮아요</text>
  <text x="614" y="289" text-anchor="middle" class="small">다르게 말함</text>

  <g transform="translate(340 335)" aria-hidden="true">
    <circle cx="60" cy="32" r="31" fill="#ffd8b5" stroke="#915635" stroke-width="4"/>
    <path d="M47 28h2M71 28h2" class="line" stroke="#78350f" stroke-width="5"/>
    <path d="M49 46h22" class="line" stroke="#78350f" stroke-width="4"/>
    <path d="M22 77c0-20 17-36 38-36s38 16 38 36v63H22Z" fill="#ffe4e6" stroke="#be123c" stroke-width="4"/>
    <path d="M44 88h32" class="line" stroke="#be123c" stroke-width="4" stroke-dasharray="6 6"/>
  </g>

  <text x="400" y="502" text-anchor="middle" class="small">속마음과 말 사이에 숨긴 내용이 있어요</text>
</svg>
