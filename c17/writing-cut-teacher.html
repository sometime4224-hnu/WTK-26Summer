    <style>
        /* ── 교사 배너 ─────────────────────────── */
        .teacher-banner {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 16px;
            background: #1e3a5f;
            color: #ffffff;
            font-size: 13px;
            font-weight: 900;
        }
        .teacher-banner i { font-size: 15px; opacity: 0.85; }
        .teacher-banner span {
            font-size: 12px;
            font-weight: 500;
            opacity: 0.75;
        }

        /* ── topbar (학생용 재활용) ───────────────────── */
        .global-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.94);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(12px);
        }
        .global-nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }
        .global-nav-links a {
            color: var(--accent-dark, #1d4ed8);
            font-size: 12px;
            font-weight: 900;
            text-decoration: none;
            white-space: nowrap;
        }
        .global-nav-links a[aria-current="page"] {
            color: var(--ink, #172033);
        }
        .global-nav-links span {
            color: #cbd5e1;
            font-size: 11px;
        }
        .global-nav-passage-btn {
            flex: 0 0 auto;
            min-height: 30px;
            border: 1px solid var(--accent-line, #93c5fd);
            border-radius: 999px;
            padding: 0 10px;
            background: var(--accent-soft, #dbeafe);
            color: var(--accent-dark, #1d4ed8);
            font-size: 11px;
            font-weight: 900;
            cursor: pointer;
        }

        /* ── 학생용 페이지 CSS 그대로 상속 ─────── */
        /* writing-cut.html의 인라인 CSS를 여기서 최소 복제 */
        /* (실제 배포 시 공유 CSS로 추출 권장) */
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: var(--font-sans, "Noto Sans KR", sans-serif);
            color: var(--ink, #172033);
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            min-height: 100vh;
        }
        .page-shell { min-height: 100vh; }
        #app { width: min(1040px, calc(100% - 24px)); margin: 14px auto 48px; }

        /* 교사 모드 강조 */
        .teacher-mode .step-pill.active,
        .teacher-mode .cut-pick.active,
        .teacher-mode .cut-pill.active {
            background: #1e3a5f !important;
            color: #ffffff !important;
            border-color: #1e3a5f !important;
        }

<body class="teacher-mode writing-cut-common">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NB76SV96"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div class="teacher-banner">
        <i class="fa-solid fa-chalkboard-user"></i>
        교사용 버전
        <span>진행 제한 없이 모든 단계·컷을 자유롭게 열 수 있습니다.</span>
    </div>

    <nav class="global-nav" aria-label="페이지 이동">
        <div class="global-nav-links">
            <a href="../index.html"><i class="fa-solid fa-house"></i> 메인</a>
            <span>|</span>
            <a href="index.html">17과 목록</a>
            <span>|</span>
            <a href="reading-cuttoon.html">읽기 컷툰</a>
            <span>|</span>
            <a href="writing-cut.html">학생용</a>
            <span>|</span>
            <a href="writing-cut-teacher.html" aria-current="page">교사용</a>
        </div>
        <button
            type="button"
            class="global-nav-passage-btn"
            id="passageBtn"
            aria-label="지문 보기"
        >
            <i class="fa-solid fa-book-open"></i> 지문
        </button>
    </nav>

    <main class="page-shell writing-shell">
        <section class="writing-hero">
            <div>
                <p class="writing-hero__eyebrow">Teacher Cut Writing</p>
                <h1>서동요 컷 쓰기 · 교사용</h1>
                <p class="writing-hero__lead">모든 컷과 단계를 자유롭게 열어 시범을 보이거나 정답을 확인할 수 있습니다.</p>
            </div>
            <div class="writing-hero__links">
                <a class="writing-link" href="reading.html"><i class="fa-solid fa-book-open"></i> 지문 읽기</a>
                <a class="writing-link writing-link--primary" href="writing-cut.html"><i class="fa-solid fa-user-graduate"></i> 학생용</a>
            </div>
        </section>

        <section class="practice" aria-label="교사용 컷 쓰기 연습">
            <aside class="rail" aria-label="컷 선택">
                <h2>컷 선택</h2>
                <p>교사용 진행 기록은 학생용과 별도로 자동 저장됩니다.</p>
                <div id="cutRail"></div>
            </aside>

            <section class="workbench" aria-live="polite">
                <div class="stage-head">
                    <div class="stage-title">
                        <p class="eyebrow" id="stageEyebrow">Step</p>
                        <h2 id="stageTitle">연습 준비</h2>
                    </div>
                    <div class="progress-dots" id="progressDots" aria-label="단계 진행"></div>
                </div>

                <div class="mode-row" id="modeRow" aria-label="연습 단계"></div>

                <div class="work-grid">
                    <figure class="image-panel">
                        <img id="cutImage" src="../assets/c17/reading-writing/images/writing-cut/c17-writing-cut-01.webp" alt="서동요 컷 1" loading="eager" decoding="async">
                        <figcaption class="caption" id="cutCaption">1컷</figcaption>
                    </figure>

                    <div class="task-panel">
                        <article class="answer-card">
                            <h3 id="taskHeading">문장을 확인하세요.</h3>
                            <p id="taskGuide">컷에 맞는 활동이 여기에 표시됩니다.</p>
                            <div id="taskBody"></div>
                            <div class="feedback" id="feedback"></div>
                            <div class="answer-text" id="answerText"></div>
                            <div class="button-row">
                                <button class="btn" type="button" id="prevBtn"><i class="fa-solid fa-arrow-left"></i> 이전</button>
                                <button class="btn" type="button" id="checkBtn"><i class="fa-solid fa-check"></i> 확인</button>
                                <button class="btn" type="button" id="showAnswerBtn"><i class="fa-solid fa-eye"></i> 정답 보기</button>
                                <button class="btn rose" type="button" id="nextBtn">다음 <i class="fa-solid fa-arrow-right"></i></button>
                            </div>
                        </article>
                    </div>
                </div>
            </section>
        </section>
        <div id="activityStateTools"></div>
    </main>

    <script>
        window.C17_WRITING_CUT_TEACHER = true;

        // 지문 보기 버튼 — reading.html로 이동
        document.getElementById("passageBtn").addEventListener("click", function () {
            window.open("reading.html", "_blank");
        });
    </script>
