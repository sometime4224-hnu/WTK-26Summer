<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="honestly-title honestly-desc" shape-rendering="geometricPrecision">
  <title id="honestly-title">솔직히 의미 도식</title>
