<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">우연히 의미 도식</title>
  <desc id="desc">약속하지 않은 두 사람이 각자의 길을 가다가 뜻밖에 마주치는 장면이다.</desc>
  <defs>
    <marker id="path-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#2563eb"/>
    </marker>
    <style>
      text{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#172033}
      .label{font-size:25px;font-weight:900}
      .small{font-size:19px;font-weight:800;fill:#526178}
      .head{fill:#ffd8b5;stroke:#915635;stroke-width:3}
    </style>
  </defs>
  <rect width="800" height="520" rx="28" fill="#f7fbff"/>
  <rect x="38" y="32" width="724" height="67" rx="22" fill="#e8f1ff"/>
  <text x="400" y="76" text-anchor="middle" class="label"><tspan fill="#1d4ed8">계획 없음</tspan> + <tspan fill="#c2410c">뜻밖의 만남</tspan></text>

  <g transform="translate(72 142)">
    <rect width="154" height="116" rx="18" fill="#fff" stroke="#b8c8df" stroke-width="3"/>
    <rect width="154" height="32" rx="18" fill="#dce7f6"/>
    <path d="M0 32h154" stroke="#b8c8df" stroke-width="3"/>
    <circle cx="44" cy="67" r="9" fill="#cbd5e1"/>
    <circle cx="78" cy="67" r="9" fill="#cbd5e1"/>
    <circle cx="112" cy="67" r="9" fill="#cbd5e1"/>
    <text x="77" y="102" text-anchor="middle" class="small">약속 없음</text>
    <path d="M9 9 145 107" stroke="#e11d48" stroke-width="8" stroke-linecap="round"/>
  </g>

  <path d="M118 404C248 404 287 338 392 299" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-dasharray="8 14" marker-end="url(#path-arrow)"/>
  <path d="M682 404C552 404 513 338 408 299" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round" stroke-dasharray="8 14" marker-end="url(#path-arrow)"/>

  <g transform="translate(79 332)">
    <circle class="head" cx="39" cy="29" r="27"/>
    <rect x="7" y="62" width="64" height="82" rx="25" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  </g>
  <g transform="translate(604 332)">
    <circle class="head" cx="39" cy="29" r="27"/>
    <rect x="7" y="62" width="64" height="82" rx="25" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
  </g>

  <g transform="translate(331 190)">
    <path d="M69 0 84 41l43-8-28 35 29 35-44-8-15 42-15-42-44 8 29-35-28-35 43 8Z" fill="#ffd966" stroke="#d97706" stroke-width="4"/>
    <text x="69" y="78" text-anchor="middle" style="font-size:34px;font-weight:900;fill:#92400e">!</text>
  </g>
  <text x="400" y="450" text-anchor="middle" class="label">가다가 갑자기 만났어요</text>
  <text x="400" y="483" text-anchor="middle" class="small">미리 정하거나 예상하지 않았어요</text>
</svg>
