<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="intentionally-title intentionally-desc" shape-rendering="geometricPrecision">
  <title id="intentionally-title">일부러 의미 도식</title>
  <desc id="intentionally-desc">미리 약속한 두 사람이 계획한 길을 따라 약속 장소로 가서 의도적으로 만나는 장면이다.</desc>
  <defs>
    <marker id="intentionally-arrow-blue" viewBox="0 0 18 18" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 17 9 1 17Z" fill="#2563eb"/>
    </marker>
    <marker id="intentionally-arrow-orange" viewBox="0 0 18 18" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 17 9 1 17Z" fill="#ea580c"/>
    </marker>
    <style>
      text{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#172033}
      .label{font-size:26px;font-weight:900}
      .small{font-size:20px;font-weight:800;fill:#526178}
      .person-line{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:5}
    </style>
  </defs>

  <rect width="800" height="520" rx="28" fill="#f7fff9"/>
  <rect x="38" y="32" width="724" height="67" rx="22" fill="#dcfce7"/>
  <text x="400" y="76" text-anchor="middle" class="label"><tspan fill="#15803d">계획 있음</tspan> + <tspan fill="#7c3aed">의도한 행동</tspan></text>

  <g transform="translate(55 132)" aria-hidden="true">
    <rect width="176" height="105" rx="18" fill="#fff" stroke="#86c89b" stroke-width="3"/>
    <path d="M0 34H176" fill="none" stroke="#86c89b" stroke-width="3"/>
    <path d="M36 0v18M140 0v18" fill="none" stroke="#4b7b5b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="49" cy="60" r="7" fill="#bbf7d0"/>
    <circle cx="88" cy="60" r="7" fill="#22c55e"/>
    <circle cx="127" cy="60" r="7" fill="#bbf7d0"/>
    <text x="88" y="91" text-anchor="middle" class="small">약속 있음</text>
    <circle cx="151" cy="18" r="18" fill="#15803d"/>
    <path d="m142 18 6 6 12-14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M177 351C248 350 301 313 354 286" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" marker-end="url(#intentionally-arrow-blue)"/>
  <path d="M623 351C552 350 499 313 446 286" fill="none" stroke="#ea580c" stroke-width="7" stroke-linecap="round" marker-end="url(#intentionally-arrow-orange)"/>

  <g transform="translate(92 282)" aria-hidden="true">
    <circle cx="42" cy="26" r="21" fill="#ffd8b5" stroke="#915635" stroke-width="3"/>
    <path d="M47 24h2" class="person-line" stroke="#78350f"/>
    <rect x="20" y="51" width="45" height="57" rx="19" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <path d="M22 65 6 84M64 66l16 13M35 108l-16 31M51 108l18 29" class="person-line" stroke="#2563eb"/>
  </g>

  <g transform="translate(626 282)" aria-hidden="true">
    <circle cx="42" cy="26" r="21" fill="#ffd8b5" stroke="#915635" stroke-width="3"/>
    <path d="M35 24h2" class="person-line" stroke="#78350f"/>
    <rect x="20" y="51" width="45" height="57" rx="19" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
    <path d="M22 66 6 79M64 65l16 19M35 108l-18 29M51 108l16 31" class="person-line" stroke="#ea580c"/>
  </g>

  <g aria-hidden="true">
    <circle cx="400" cy="279" r="38" fill="#dcfce7" stroke="#15803d" stroke-width="5"/>
    <path d="m381 279 13 13 27-31" fill="none" stroke="#15803d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="400" y="438" text-anchor="middle" class="label">약속한 곳으로 만나러 갔어요</text>
  <text x="400" y="474" text-anchor="middle" class="small">미리 정하고 의도해서 행동했어요</text>
