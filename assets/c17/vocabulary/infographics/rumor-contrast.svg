<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
  <title id="title">소문이 나다·소문을 내다·소문이 퍼지다·소문을 퍼뜨리다 비교 도식</title>
  <desc id="desc">소문이 주어인 상태 변화와 사람이 소문을 대상으로 하는 행동을 네 장면의 화살표로 비교한다.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f3f8ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#24324a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 11 5.5 0 11Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 11 5.5 0 11Z" fill="#ea580c"/>
    </marker>
    <style>
      text{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#172033}
      .term{font-size:32px;font-weight:900;letter-spacing:-1px}
      .tag{font-size:19px;font-weight:800}
      .note{font-size:20px;font-weight:750}
      .tiny{font-size:17px;font-weight:750;fill:#475569}
      .person-head{fill:#ffd8b5;stroke:#9a5d38;stroke-width:3}
      .person-body{fill:#dbeafe;stroke:#2563eb;stroke-width:3}
      .person-body.orange{fill:#ffedd5;stroke:#ea580c}
    </style>
  </defs>

  <rect width="1200" height="880" rx="36" fill="url(#paper)"/>

  <g transform="translate(42 26)">
    <rect width="536" height="58" rx="29" fill="#e8f1ff"/>
    <circle cx="31" cy="29" r="16" fill="#2563eb"/>
    <text x="58" y="38" class="tag"><tspan fill="#1d4ed8">소문이</tspan> 주인공 → 상태가 달라져요</text>
  </g>
  <g transform="translate(622 26)">
    <rect width="536" height="58" rx="29" fill="#fff0e5"/>
    <circle cx="31" cy="29" r="16" fill="#ea580c"/>
    <text x="58" y="38" class="tag"><tspan fill="#c2410c">사람이</tspan> 주인공 → 소문을 행동해요</text>
  </g>

  <!-- 소문이 나다 -->
  <g transform="translate(32 108)" filter="url(#shadow)">
    <rect width="552" height="338" rx="28" fill="#fff" stroke="#9fc0ff" stroke-width="4"/>
    <rect x="22" y="20" width="151" height="40" rx="20" fill="#e8f1ff"/>
    <text x="42" y="48" class="tag" fill="#1d4ed8">새로 알려짐</text>
    <text x="24" y="101" class="term">소문<tspan fill="#1d4ed8">이</tspan> 나다</text>

    <g transform="translate(82 151)">
      <circle class="person-head" cx="36" cy="30" r="24"/>
      <rect class="person-body" x="7" y="58" width="58" height="72" rx="22"/>
    </g>
    <g transform="translate(388 151)">
      <circle class="person-head" cx="36" cy="30" r="24"/>
      <rect class="person-body" x="7" y="58" width="58" height="72" rx="22"/>
    </g>
    <g transform="translate(224 132)">
      <path d="M20 24c0-13 12-24 27-24h79c15 0 27 11 27 24v50c0 13-12 24-27 24H83l-30 22 6-22H47C32 98 20 87 20 74Z" fill="#fff1d6" stroke="#f59e0b" stroke-width="4"/>
      <text x="86" y="59" text-anchor="middle" style="font-size:31px;font-weight:900;fill:#b45309">?</text>
      <path d="M86 107c0 13 0 24 0 39" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-dasharray="3 14"/>
    </g>
    <text x="276" y="309" text-anchor="middle" class="note">누가 시작했는지 몰라도 소문이 생겨요</text>
  </g>

  <!-- 소문을 내다 -->
  <g transform="translate(616 108)" filter="url(#shadow)">
    <rect width="552" height="338" rx="28" fill="#fff" stroke="#fdba74" stroke-width="4"/>
    <rect x="22" y="20" width="151" height="40" rx="20" fill="#fff0e5"/>
    <text x="42" y="48" class="tag" fill="#c2410c">처음 말함</text>
    <text x="24" y="101" class="term">소문<tspan fill="#c2410c">을</tspan> 내다</text>

    <g transform="translate(76 151)">
      <circle class="person-head" cx="36" cy="30" r="24"/>
      <rect class="person-body orange" x="7" y="58" width="58" height="72" rx="22"/>
      <path d="M70 18 96 7M73 36l31 3M66 2l17-22" stroke="#ea580c" stroke-width="6" stroke-linecap="round"/>
    </g>
    <path d="M190 211C250 172 301 172 352 211" fill="none" stroke="#ea580c" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
    <g transform="translate(388 151)">
      <circle class="person-head" cx="36" cy="30" r="24"/>
      <rect class="person-body orange" x="7" y="58" width="58" height="72" rx="22"/>
      <text x="36" y="37" text-anchor="middle" style="font-size:24px;font-weight:900;fill:#7c2d12">!</text>
    </g>
    <text x="276" y="309" text-anchor="middle" class="note">한 사람이 소문을 처음 말하기 시작해요</text>
  </g>

  <!-- 소문이 퍼지다 -->
  <g transform="translate(32 474)" filter="url(#shadow)">
    <rect width="552" height="374" rx="28" fill="#fff" stroke="#9fc0ff" stroke-width="4"/>
    <rect x="22" y="20" width="174" height="40" rx="20" fill="#e8f1ff"/>
    <text x="42" y="48" class="tag" fill="#1d4ed8">범위가 넓어짐</text>
    <text x="24" y="101" class="term">소문<tspan fill="#1d4ed8">이</tspan> 퍼지다</text>

    <g transform="translate(42 156)">
      <g transform="translate(0)"><circle class="person-head" cx="27" cy="23" r="20"/><rect class="person-body" x="4" y="48" width="46" height="60" rx="18"/></g>
      <g transform="translate(144)"><circle class="person-head" cx="27" cy="23" r="20"/><rect class="person-body" x="4" y="48" width="46" height="60" rx="18"/></g>
      <g transform="translate(288)"><circle class="person-head" cx="27" cy="23" r="20"/><rect class="person-body" x="4" y="48" width="46" height="60" rx="18"/></g>
      <g transform="translate(432)"><circle class="person-head" cx="27" cy="23" r="20"/><rect class="person-body" x="4" y="48" width="46" height="60" rx="18"/></g>
      <path d="M58 55h67M202 55h67M346 55h67" stroke="#2563eb" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    </g>
    <text x="276" y="309" text-anchor="middle" class="note">같은 소문이 사람에서 사람으로 이어져요</text>
    <text x="276" y="341" text-anchor="middle" class="tiny">1명 → 2명 → 3명 → 4명</text>
  </g>

  <!-- 소문을 퍼뜨리다 -->
  <g transform="translate(616 474)" filter="url(#shadow)">
    <rect width="552" height="374" rx="28" fill="#fff" stroke="#fdba74" stroke-width="4"/>
    <rect x="22" y="20" width="174" height="40" rx="20" fill="#fff0e5"/>
    <text x="42" y="48" class="tag" fill="#c2410c">여러 곳에 보냄</text>
    <text x="24" y="101" class="term">소문<tspan fill="#c2410c">을</tspan> 퍼뜨리다</text>

    <g transform="translate(252 190)">
      <circle class="person-head" cx="24" cy="20" r="20"/>
      <rect class="person-body orange" x="1" y="44" width="46" height="60" rx="18"/>
    </g>
    <g transform="translate(72 143)"><circle class="person-head" cx="24" cy="20" r="20"/><rect class="person-body orange" x="1" y="44" width="46" height="60" rx="18"/></g>
    <g transform="translate(432 143)"><circle class="person-head" cx="24" cy="20" r="20"/><rect class="person-body orange" x="1" y="44" width="46" height="60" rx="18"/></g>
    <g transform="translate(432 257)"><circle class="person-head" cx="24" cy="20" r="20"/><rect class="person-body orange" x="1" y="44" width="46" height="60" rx="18"/></g>
    <path d="M251 218 137 191M301 218l114-27M301 253l114 31" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
    <text x="239" y="340" text-anchor="end" class="note">한 사람이</text>
    <text x="247" y="340" class="note" fill="#c2410c">여러 사람에게</text>
  </g>
</svg>
