<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="understand-title understand-desc" shape-rendering="geometricPrecision">
  <title id="understand-title">제대로 이해하다 의미 도식</title>
  <desc id="understand-desc">두 사람이 깜짝 선물을 준비하는 실제 장면을 본 사람이 그 뜻을 사실대로 정확히 이해하는 장면이다.</desc>
  <defs>
    <style>
      text{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#172033}
      .label{font-size:26px;font-weight:900}
      .small{font-size:20px;font-weight:800;fill:#526178}
      .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
      .head{fill:#ffd8b5;stroke:#915635;stroke-width:3}
    </style>
  </defs>

  <rect width="800" height="520" rx="28" fill="#f7fbff"/>
  <rect x="38" y="32" width="724" height="67" rx="22" fill="#e0f2fe"/>
  <text x="400" y="76" text-anchor="middle" class="label"><tspan fill="#2563eb">실제 사실</tspan> = <tspan fill="#0f766e">내가 이해한 내용</tspan></text>

  <g transform="translate(40 126)">
    <rect width="300" height="232" rx="24" fill="#fff" stroke="#9fc0ff" stroke-width="4"/>
    <text x="150" y="44" text-anchor="middle" class="label" fill="#1d4ed8">실제 사실</text>
    <g transform="translate(35 69)" aria-hidden="true">
      <circle class="head" cx="30" cy="27" r="23"/>
      <rect x="4" y="54" width="52" height="69" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    </g>
    <g transform="translate(205 69)" aria-hidden="true">
      <circle class="head" cx="30" cy="27" r="23"/>
      <rect x="4" y="54" width="52" height="69" rx="20" fill="#dff6f1" stroke="#0f766e" stroke-width="3"/>
    </g>
    <path d="M99 97q51-36 102 0" class="line" stroke="#2563eb" stroke-width="5" stroke-dasharray="7 8"/>
    <g transform="translate(111 94)" aria-hidden="true">
      <rect x="0" y="39" width="78" height="54" rx="3" fill="#fff2c7" stroke="#b45309" stroke-width="3"/>
      <path d="M0 39h78M39 39v54" class="line" stroke="#b45309" stroke-width="3"/>
      <path d="M19 39q-5-22 20-8M59 39q5-22-20-8" class="line" stroke="#be123c" stroke-width="5"/>
    </g>
    <text x="150" y="218" text-anchor="middle" class="small">깜짝 선물을 준비해요</text>
  </g>

  <g transform="translate(460 126)">
    <rect width="300" height="232" rx="24" fill="#fff" stroke="#72c7b7" stroke-width="4"/>
    <text x="150" y="44" text-anchor="middle" class="label" fill="#0f766e">제대로 이해함</text>
    <rect x="28" y="62" width="244" height="108" rx="30" fill="#e6f7f4" stroke="#0f766e" stroke-width="4"/>
    <text x="150" y="111" text-anchor="middle" class="label" fill="#0f5f59">깜짝 선물을</text>
    <text x="150" y="143" text-anchor="middle" class="label" fill="#0f5f59">준비하는구나!</text>
    <text x="150" y="218" text-anchor="middle" class="small">사실대로 이해해요</text>
  </g>

  <path d="M340 269C363 283 377 310 387 338" class="line" stroke="#2563eb" stroke-width="6" stroke-dasharray="7 10"/>
  <g aria-hidden="true">
    <path d="M361 268q12-12 24 0-12 12-24 0Z" fill="#fff" stroke="#2563eb" stroke-width="3"/>
    <circle cx="373" cy="268" r="4" fill="#2563eb"/>
  </g>

  <circle cx="450" cy="336" r="4" fill="#14b8a6"/>
  <circle cx="467" cy="324" r="7" fill="#14b8a6"/>
  <circle cx="489" cy="307" r="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="4"/>

  <g transform="translate(340 334)" aria-hidden="true">
    <circle class="head" cx="60" cy="31" r="30"/>
    <path d="M47 27h3M70 27h3" class="line" stroke="#78350f" stroke-width="5"/>
    <path d="M49 43q11 10 22 0" class="line" stroke="#78350f" stroke-width="4"/>
    <rect x="23" y="67" width="74" height="76" rx="28" fill="#e6f7f4" stroke="#0f766e" stroke-width="4"/>
  </g>

  <g aria-hidden="true">
    <circle cx="400" cy="305" r="24" fill="#dcfce7" stroke="#15803d" stroke-width="4"/>
    <path d="m388 305 8 8 17-20" class="line" stroke="#15803d" stroke-width="5"/>
  </g>

  <text x="400" y="505" text-anchor="middle" class="small">본 것과 뜻을 사실대로 연결했어요</text>
</svg>
