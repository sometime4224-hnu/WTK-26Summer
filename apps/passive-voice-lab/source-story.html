<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <title>피동을 보는 눈 | 피동 탐험대</title>
  <link rel="stylesheet" href="assets/css/source-story.css">
</head>
<body>
  <a class="skip-link" href="#story-main">활동으로 바로 가기</a>
  <header class="story-topbar">
    <a href="../index.html" class="story-brand">← 프로그램 허브</a>
    <a href="index.html" class="story-continue-top" data-story-continue>바로 진단으로 →</a>
  </header>
  <main id="story-main">
    <section class="story-intro" aria-labelledby="story-title">
      <p class="story-kicker">피동을 보는 눈</p>
      <h1 id="story-title">누구를 중심에 둘까요?</h1>
      <p id="story-instruction">화살표를 눌러 장면의 중심이 바뀌는 모습을 살펴보세요.</p>
    </section>
    <section class="story-shell" aria-label="피동 학습 이야기">
      <div class="story-status-row">
        <p data-story-progress aria-label="현재 1 / 35">1 / 35</p>
        <p class="save-status" data-story-save-status role="status" aria-live="polite">이 기기에 저장돼요.</p>
      </div>
      <div class="storage-recovery" hidden role="alert">
        <p>기존 기록은 건드리지 않고 새 이야기로 열었어요.</p>
        <button type="button" data-story-reset>이 이야기 기록 초기화</button>
      </div>
      <div class="story-stage" data-story-scene data-frame="1" data-scene="intro" data-focus="actor" aria-live="polite" aria-atomic="true" tabindex="-1">
        <p class="scene-label" data-story-scene-label>능동과 피동</p>
        <div class="visual-scene" role="img" aria-label="장면 속 대상의 위치와 강조가 함께 바뀝니다.">
          <div class="person person-me" data-object="me">나</div>
          <div class="person person-younghee" data-object="younghee">영희</div>
          <div class="flower" data-object="flower">🌷</div>
          <div class="cafe" data-object="cafe">☕</div>
          <div class="eye" data-object="eye">👀</div>
          <div class="tiger" data-object="tiger">🐯</div>
          <div class="chicken" data-object="chicken">🐔</div>
          <div class="arrow arrow-one" data-object="arrow-one">→</div>
          <div class="arrow arrow-two" data-object="arrow-two">→</div>
          <div class="role-card role-subject" data-object="role-subject">주어<br><b>이/가</b></div>
          <div class="role-card role-object" data-object="role-object">목적어<br><b>을/를</b></div>
          <div class="role-card role-verb" data-object="role-verb">동사</div>
          <div class="role-card role-agent" data-object="role-agent">주어<br><b>에게</b></div>
          <div class="role-card role-passive" data-object="role-passive">피동사</div>
          <div class="swap-mark" data-object="swap">⇄</div>
        </div>
        <div class="story-message" data-story-message></div>
        <div class="story-table" data-story-table hidden></div>
      </div>
      <div class="story-actions" aria-label="이야기 이동">
        <button type="button" data-story-back aria-label="이전 장면" disabled>← 이전</button>
        <button type="button" data-story-next>다음 장면 →</button>
      </div>
      <div class="story-finish" data-story-finish hidden>
        <p>이제 진단에서 내 출발점을 찾아 볼까요?</p>
        <a class="continue-button" data-story-continue href="index.html">진단으로 계속하기 →</a>
      </div>
      <button type="button" class="reset-link" data-story-reset>이 이야기 처음부터</button>
    </section>
  </main>
  <script src="assets/js/source-story.js"></script>
</body>
</html>
