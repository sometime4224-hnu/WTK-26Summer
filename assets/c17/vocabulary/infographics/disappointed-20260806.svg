<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">실망하다 의미 도식</title>
  <desc id="desc">친구가 올 것이라는 기대와 빈 의자만 남은 실제 결과가 달라 마음이 내려앉는 장면이다.</desc>
  <defs>
    <marker id="down-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#b45309"/>
    </marker>
    <style>
      text{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#172033}
      .label{font-size:25px;font-weight:900}
      .small{font-size:19px;font-weight:800;fill:#526178}
    </style>
  </defs>
  <rect width="800" height="520" rx="28" fill="#fffaf0"/>
  <rect x="38" y="32" width="724" height="67" rx="22" fill="#fff2c7"/>
  <text x="400" y="76" text-anchor="middle" class="label"><tspan fill="#a16207">기대</tspan> ≠ <tspan fill="#be123c">실제</tspan> → 마음이 내려앉음</text>

  <g transform="translate(45 130)">
    <rect width="290" height="218" rx="24" fill="#fff" stroke="#e7c45a" stroke-width="4"/>
    <text x="145" y="43" text-anchor="middle" class="label" fill="#a16207">기대</text>
    <circle cx="103" cy="88" r="27" fill="#ffd8b5" stroke="#915635" stroke-width="3"/>
    <rect x="72" y="118" width="62" height="64" rx="23" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <circle cx="201" cy="88" r="27" fill="#ffd8b5" stroke="#915635" stroke-width="3"/>
    <rect x="170" y="118" width="62" height="64" rx="23" fill="#dff6f1" stroke="#0f766e" stroke-width="3"/>
    <path d="M137 99q15-18 30 0" fill="none" stroke="#e7c45a" stroke-width="6" stroke-linecap="round"/>
    <text x="145" y="207" text-anchor="middle" class="small">친구가 올 거예요</text>
  </g>

  <text x="400" y="251" text-anchor="middle" style="font-family:Pretendard,'Noto Sans KR',sans-serif;font-size:54px;font-weight:900;fill:#be123c">≠</text>

  <g transform="translate(465 130)">
    <rect width="290" height="218" rx="24" fill="#fff" stroke="#f3a6b8" stroke-width="4"/>
    <text x="145" y="43" text-anchor="middle" class="label" fill="#be123c">실제</text>
    <path d="M103 104h83v70h-83ZM91 174h107" fill="#e2e8f0" stroke="#64748b" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="225" cy="78" r="20" fill="#fff0f3" stroke="#be123c" stroke-width="4"/>
    <path d="m211 64 28 28M239 64l-28 28" stroke="#be123c" stroke-width="5" stroke-linecap="round"/>
    <text x="145" y="207" text-anchor="middle" class="small">빈 의자만 있어요</text>
  </g>

  <path d="M400 351v74" stroke="#b45309" stroke-width="9" stroke-linecap="round" marker-end="url(#down-arrow)"/>
  <g transform="translate(318 386)">
    <circle cx="82" cy="39" r="36" fill="#ffd8b5" stroke="#915635" stroke-width="4"/>
    <path d="M68 52q14-12 28 0" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <path d="M66 31h2M96 31h2" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="400" y="509" text-anchor="middle" class="small">바라던 것과 달라 마음이 상했어요</text>
</svg>
