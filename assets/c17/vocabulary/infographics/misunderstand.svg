<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">오해하다 의미 도식</title>
  <desc id="desc">두 사람이 깜짝 파티를 준비하는 실제 사실을 다른 사람이 자기 흉을 보는 것으로 잘못 이해하는 장면이다.</desc>
  <defs>
    <marker id="look-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#7c3aed"/>
    </marker>
    <style>
      text{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#172033}
      .label{font-size:25px;font-weight:900}
      .small{font-size:19px;font-weight:800;fill:#526178}
      .head{fill:#ffd8b5;stroke:#915635;stroke-width:3}
    </style>
  </defs>
  <rect width="800" height="520" rx="28" fill="#fbf8ff"/>
  <rect x="38" y="32" width="724" height="67" rx="22" fill="#f0e9ff"/>
  <text x="400" y="76" text-anchor="middle" class="label"><tspan fill="#2563eb">실제 사실</tspan> ≠ <tspan fill="#be123c">내가 이해한 내용</tspan></text>

  <g transform="translate(42 128)">
    <rect width="300" height="230" rx="24" fill="#fff" stroke="#9fc0ff" stroke-width="4"/>
    <text x="150" y="40" text-anchor="middle" class="label" fill="#1d4ed8">실제 사실</text>
    <g transform="translate(38 78)"><circle class="head" cx="29" cy="25" r="23"/><rect x="3" y="53" width="52" height="70" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/></g>
    <g transform="translate(208 78)"><circle class="head" cx="29" cy="25" r="23"/><rect x="3" y="53" width="52" height="70" rx="20" fill="#dff6f1" stroke="#0f766e" stroke-width="3"/></g>
    <path d="M100 101q50-38 100 0" fill="none" stroke="#2563eb" stroke-width="5" stroke-dasharray="8 8"/>
    <g transform="translate(111 98)">
      <path d="M0 40h78v52H0Z" fill="#fff2c7" stroke="#b45309" stroke-width="3"/>
      <path d="M0 40h78M39 40v52" stroke="#b45309" stroke-width="3"/>
      <path d="M19 40q-5-22 20-8M59 40q5-22-20-8" fill="none" stroke="#be123c" stroke-width="5"/>
    </g>
    <text x="150" y="216" text-anchor="middle" class="small">깜짝 선물을 준비해요</text>
  </g>

  <path d="M347 244h93" stroke="#7c3aed" stroke-width="8" stroke-linecap="round" stroke-dasharray="7 10" marker-end="url(#look-arrow)"/>
  <circle cx="398" cy="198" r="24" fill="#fff0f3" stroke="#be123c" stroke-width="4"/>
  <text x="398" y="207" text-anchor="middle" style="font-family:Pretendard,'Noto Sans KR',sans-serif;font-size:27px;font-weight:900;fill:#be123c">?</text>

  <g transform="translate(458 128)">
    <rect width="300" height="230" rx="24" fill="#fff" stroke="#f3a6b8" stroke-width="4"/>
    <text x="150" y="40" text-anchor="middle" class="label" fill="#be123c">잘못 이해함</text>
    <path d="M30 77c0-13 12-23 27-23h187c15 0 27 10 27 23v70c0 13-12 23-27 23H122l-35 27 8-27H57c-15 0-27-10-27-23Z" fill="#fff0f3" stroke="#be123c" stroke-width="4"/>
    <text x="150" y="119" text-anchor="middle" class="label" fill="#9f1239">내 흉을 봐!</text>
    <text x="150" y="216" text-anchor="middle" class="small">사실과 다르게 생각해요</text>
  </g>

  <g transform="translate(330 335)">
    <circle class="head" cx="70" cy="33" r="30"/>
    <rect x="35" y="69" width="70" height="78" rx="28" fill="#f0e9ff" stroke="#7c3aed" stroke-width="4"/>
    <path d="M53 29h3M84 29h3" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
    <path d="M59 47q11-10 22 0" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="400" y="508" text-anchor="middle" class="small">본 것은 맞지만 뜻을 잘못 판단했어요</text>
</svg>
