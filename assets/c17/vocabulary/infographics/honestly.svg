<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">솔직히 의미 도식</title>
  <desc id="desc">한 사람의 속마음과 입 밖으로 말한 내용이 같고, 그 사이에 가리는 것이 없는 장면이다.</desc>
  <defs>
    <marker id="equal-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#0f766e"/>
    </marker>
    <style>
      text{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#172033}
      .label{font-size:25px;font-weight:900}
      .small{font-size:19px;font-weight:800;fill:#526178}
    </style>
  </defs>
  <rect width="800" height="520" rx="28" fill="#f4fcfa"/>
  <rect x="38" y="32" width="724" height="67" rx="22" fill="#dff6f1"/>
  <text x="400" y="76" text-anchor="middle" class="label"><tspan fill="#0f766e">숨기지 않음</tspan> + 진짜 생각을 말함</text>

  <g transform="translate(46 139)">
    <path d="M26 26c0-14 13-26 30-26h208c17 0 30 12 30 26v134c0 14-13 26-30 26H118l-52 40 13-40H56c-17 0-30-12-30-26Z" fill="#fff" stroke="#72c7b7" stroke-width="4"/>
    <text x="160" y="53" text-anchor="middle" class="small">속마음</text>
    <text x="160" y="111" text-anchor="middle" class="label" fill="#0f766e">오늘은 쉬고 싶어</text>
  </g>

  <path d="M350 240h92" stroke="#0f766e" stroke-width="9" stroke-linecap="round" marker-end="url(#equal-arrow)"/>
  <rect x="370" y="183" width="53" height="39" rx="19" fill="#0f766e"/>
  <text x="396" y="211" text-anchor="middle" style="font-family:Pretendard,'Noto Sans KR',sans-serif;font-size:27px;font-weight:900;fill:#fff">=</text>

  <g transform="translate(446 139)">
    <path d="M0 28C0 13 13 0 30 0h256c17 0 30 13 30 28v132c0 15-13 28-30 28h-31l15 38-59-38H30c-17 0-30-13-30-28Z" fill="#fff" stroke="#72c7b7" stroke-width="4"/>
    <text x="158" y="53" text-anchor="middle" class="small">말한 내용</text>
    <text x="158" y="111" text-anchor="middle" class="label" fill="#0f766e">오늘은 쉬고 싶어요</text>
  </g>

  <g transform="translate(322 325)">
    <circle cx="78" cy="38" r="34" fill="#ffd8b5" stroke="#915635" stroke-width="4"/>
    <path d="M38 78c0-20 18-36 40-36s40 16 40 36v71H38Z" fill="#dff6f1" stroke="#0f766e" stroke-width="4"/>
    <path d="M68 36q10 9 20 0" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="400" y="505" text-anchor="middle" class="small">속마음과 말 사이에 가리는 것이 없어요</text>
</svg>
