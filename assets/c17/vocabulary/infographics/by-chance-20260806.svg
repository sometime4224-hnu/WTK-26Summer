<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="by-chance-title by-chance-desc" shape-rendering="geometricPrecision">
  <title id="by-chance-title">우연히 의미 도식</title>
  <desc id="by-chance-desc">서로 약속하지 않은 두 사람이 각자의 길을 따라가다가 가운데에서 뜻밖에 만나는 장면이다.</desc>
  <defs>
    <marker id="by-chance-arrow-blue" viewBox="0 0 18 18" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 17 9 1 17Z" fill="#2563eb"/>
    </marker>
    <marker id="by-chance-arrow-orange" viewBox="0 0 18 18" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 17 9 1 17Z" fill="#ea580c"/>
    </marker>
    <style>
      text{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#172033}
      .label{font-size:26px;font-weight:900}
      .small{font-size:20px;font-weight:800;fill:#526178}
      .person-line{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:5}
    </style>
  </defs>

  <rect width="800" height="520" rx="28" fill="#f7fbff"/>
  <rect x="38" y="32" width="724" height="67" rx="22" fill="#e8f1ff"/>
  <text x="400" y="76" text-anchor="middle" class="label"><tspan fill="#1d4ed8">계획 없음</tspan> + <tspan fill="#c2410c">뜻밖의 만남</tspan></text>

  <g transform="translate(55 132)" aria-hidden="true">
    <rect x="0" y="0" width="176" height="105" rx="18" fill="#fff" stroke="#b8c8df" stroke-width="3"/>
    <path d="M0 34H176" fill="none" stroke="#b8c8df" stroke-width="3"/>
    <path d="M36 0v18M140 0v18" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="49" cy="60" r="7" fill="#cbd5e1"/>
    <circle cx="88" cy="60" r="7" fill="#cbd5e1"/>
    <circle cx="127" cy="60" r="7" fill="#cbd5e1"/>
    <text x="88" y="91" text-anchor="middle" class="small">약속 없음</text>
    <path d="M17 14 159 91" fill="none" stroke="#e11d48" stroke-width="8" stroke-linecap="round"/>
  </g>

  <path d="M177 351C248 350 301 313 354 286" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-dasharray="6 13" marker-end="url(#by-chance-arrow-blue)"/>
  <path d="M623 351C552 350 499 313 446 286" fill="none" stroke="#ea580c" stroke-width="7" stroke-linecap="round" stroke-dasharray="6 13" marker-end="url(#by-chance-arrow-orange)"/>

  <g transform="translate(92 282)" aria-hidden="true">
    <circle cx="42" cy="26" r="21" fill="#ffd8b5" stroke="#915635" stroke-width="3"/>
    <path d="M47 24h2" class="person-line" stroke="#78350f"/>
    <rect x="20" y="51" width="45" height="57" rx="19" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <path d="M22 65 6 84M64 66l16 13M35 108l-16 31M51 108l18 29" class="person-line" stroke="#2563eb"/>
  </g>

  <g transform="translate(626 282)" aria-hidden="true">
    <circle cx="42" cy="26" r="21" fill="#ffd8b5" stroke="#915635" stroke-width="3"/>
    <path d="M35 24h2" class="person-line" stroke="#78350f"/>
    <rect x="20" y="51" width="45" height="57" rx="19" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
    <path d="M22 66 6 79M64 65l16 19M35 108l-18 29M51 108l16 31" class="person-line" stroke="#ea580c"/>
  </g>

  <g transform="translate(370 238)" aria-hidden="true">
    <path d="M30 0 40 25l27-5-18 22 18 22-27-5-10 26-10-26-27 5 18-22L-7 20l27 5Z" fill="#ffd966" stroke="#d97706" stroke-width="4" stroke-linejoin="round"/>
    <text x="30" y="54" text-anchor="middle" style="font-family:Pretendard,'Noto Sans KR',sans-serif;font-size:32px;font-weight:900;fill:#92400e">!</text>
  </g>

  <text x="400" y="438" text-anchor="middle" class="label">가다가 갑자기 만났어요</text>
  <text x="400" y="474" text-anchor="middle" class="small">미리 정하거나 예상하지 않았어요</text>
</svg>
