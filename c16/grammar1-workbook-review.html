<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>16과 문법 1 | 워크북 복습</title>
    <link rel="stylesheet" href="grammar-workbook-review.css" />
</head>
<body class="c16-workbook-review" data-c16-workbook-review="grammar1">
    <a class="c16-wb-skip-link c16-skip-link" href="#main-content">본문으로 건너뛰기</a>
    <nav class="c16-wb-topbar" aria-label="문법 1 워크북 복습 이동">
        <a href="index.html">16과 목록</a><span>›</span><a href="grammar1.html">문법 1</a><span>›</span><strong>워크북 복습</strong>
    </nav>

    <main class="c16-wb-shell" id="main-content" tabindex="-1">
        <header class="c16-wb-intro">
            <h1>N만 하다</h1>
            <p class="c16-wb-instruction">대화를 읽고 핵심 표현을 입력하세요.</p>
        </header>

        <div data-c16-workbook-review-root>
            <section class="c16-wb-card" aria-labelledby="reviewTaskHeading">
                <div class="c16-wb-progress-row"><span data-review-progress-label>1 / 6</span></div>
                <div class="c16-wb-progress-track" aria-hidden="true"><div class="c16-wb-progress-fill" data-review-progress-fill></div></div>

                <section class="c16-wb-task" data-review-task aria-labelledby="reviewTaskHeading">
                    <p class="c16-wb-task-label" data-review-task-label id="reviewTaskHeading" tabindex="-1">문제 1</p>
                    <p class="c16-wb-question"><span class="c16-wb-speaker" aria-hidden="true">가:</span><span data-review-question></span></p>
                    <div class="c16-wb-response-form">
                        <div class="c16-wb-response-line">
                            <label class="c16-wb-response-label" id="answerLabel" for="answerInput"><span aria-hidden="true">나:</span><span class="c16-wb-visually-hidden" data-review-answer-label>1번 답</span></label>
                            <input class="c16-wb-response-input" id="answerInput" type="text" inputmode="text" autocomplete="off" spellcheck="false" aria-describedby="reviewCue" />
                        </div>
                        <p class="c16-wb-cue" id="reviewCue" data-review-cue></p>
                        <button class="c16-wb-primary-action" id="primaryAction" type="button">답 확인</button>
                    </div>
                    <p class="c16-wb-feedback" id="reviewFeedback" role="status" aria-live="polite"></p>
                    <div class="c16-wb-secondary-actions">
                        <button class="c16-wb-secondary-action" id="hintButton" type="button">힌트 보기</button>
                        <button class="c16-wb-secondary-action" id="revealButton" type="button" hidden>정답 보기</button>
                    </div>
                    <p class="c16-wb-hint" id="reviewHint" hidden></p>
                    <p class="c16-wb-answer-reveal" id="answerReveal" hidden></p>
                </section>
            </section>

            <section class="c16-wb-summary" data-review-summary hidden aria-labelledby="reviewSummaryHeading">
                <h2 id="reviewSummaryHeading" tabindex="-1">6문항 복습을 마쳤어요</h2>
                <p data-review-summary-text></p>
            </section>
        </div>

        <div class="c16-wb-below-task">
            <div data-c16-state-tools></div>
        </div>
    </main>

    <script src="../shared/c16-grammar-state.js"></script>
    <script src="grammar-workbook-review.js"></script>
    <script src="../shared/site-copyright.js"></script>
</body>
</html>
