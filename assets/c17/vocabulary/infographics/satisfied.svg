<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="satisfied-title satisfied-desc" shape-rendering="geometricPrecision">
  <title id="satisfied-title">만족하다 의미 도식</title>
  <desc id="satisfied-desc">친구가 올 것이라는 기대와 실제로 친구가 온 결과가 같아서 마음에 들어 하는 장면이다.</desc>
  <defs>
    <marker id="satisfied-arrow" viewBox="0 0 18 18" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 17 9 1 17Z" fill="#15803d"/>
    </marker>
    <style>
      text{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#172033}
      .label{font-size:26px;font-weight:900}
      .small{font-size:20px;font-weight:800;fill:#526178}
      .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="800" height="520" rx="28" fill="#f7fff9"/>
  <rect x="38" y="32" width="724" height="67" rx="22" fill="#dcfce7"/>
  <text x="400" y="76" text-anchor="middle" class="label"><tspan fill="#15803d">기대</tspan> = <tspan fill="#0f766e">실제</tspan> → 마음이 만족함</text>

  <g transform="translate(44 128)">
    <rect width="292" height="220" rx="24" fill="#fff" stroke="#86c89b" stroke-width="4"/>
    <text x="146" y="45" text-anchor="middle" class="label" fill="#15803d">기대</text>
    <g transform="translate(62 65)" aria-hidden="true">
      <circle cx="35" cy="28" r="24" fill="#ffd8b5" stroke="#915635" stroke-width="3"/>
      <rect x="9" y="55" width="52" height="63" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    </g>
    <g transform="translate(178 65)" aria-hidden="true">
      <circle cx="35" cy="28" r="24" fill="#ffd8b5" stroke="#915635" stroke-width="3"/>
      <rect x="9" y="55" width="52" height="63" rx="20" fill="#dff6f1" stroke="#0f766e" stroke-width="3"/>
    </g>
    <path d="M126 92q20-20 40 0" class="line" stroke="#22c55e" stroke-width="6"/>
    <text x="146" y="207" text-anchor="middle" class="small">친구가 올 거예요</text>
  </g>

  <text x="400" y="255" text-anchor="middle" style="font-family:Pretendard,'Noto Sans KR',sans-serif;font-size:54px;font-weight:900;fill:#15803d">=</text>

  <g transform="translate(464 128)">
    <rect width="292" height="220" rx="24" fill="#fff" stroke="#72c7b7" stroke-width="4"/>
    <text x="146" y="45" text-anchor="middle" class="label" fill="#0f766e">실제</text>
    <g transform="translate(62 65)" aria-hidden="true">
      <circle cx="35" cy="28" r="24" fill="#ffd8b5" stroke="#915635" stroke-width="3"/>
      <rect x="9" y="55" width="52" height="63" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    </g>
    <g transform="translate(178 65)" aria-hidden="true">
      <circle cx="35" cy="28" r="24" fill="#ffd8b5" stroke="#915635" stroke-width="3"/>
      <rect x="9" y="55" width="52" height="63" rx="20" fill="#dff6f1" stroke="#0f766e" stroke-width="3"/>
    </g>
    <path d="M126 92q20-20 40 0" class="line" stroke="#22c55e" stroke-width="6"/>
    <circle cx="239" cy="82" r="21" fill="#dcfce7" stroke="#15803d" stroke-width="4"/>
    <path d="m226 82 8 8 17-20" class="line" stroke="#15803d" stroke-width="5"/>
    <text x="146" y="207" text-anchor="middle" class="small">친구가 왔어요</text>
  </g>

  <path d="M400 360v31" fill="none" stroke="#15803d" stroke-width="8" stroke-linecap="round" marker-end="url(#satisfied-arrow)"/>
  <g aria-hidden="true">
    <path d="M400 474C382 459 361 446 361 426c0-15 11-25 25-25 7 0 12 3 14 9 4-6 9-9 16-9 14 0 25 10 25 25 0 20-22 33-41 48Z" fill="#dcfce7" stroke="#15803d" stroke-width="4" stroke-linejoin="round"/>
    <path d="M383 427h2M415 427h2" class="line" stroke="#14532d" stroke-width="6"/>
    <path d="M389 443q11 10 22 0" class="line" stroke="#14532d" stroke-width="4"/>
  </g>

  <text x="400" y="505" text-anchor="middle" class="small">바라던 대로 되어 마음에 들었어요</text>
</svg>
