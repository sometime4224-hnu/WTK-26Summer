<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>복습 5 듣기 지문 보기</title>
    <link rel="stylesheet" href="assets/listening-transcripts.css">
  </head>
  <body>
    <main class="transcript-app">
      <header class="page-header">
        <a class="return-link" href="listening.html">듣기 퀴즈로 돌아가기</a>
        <h1>듣기 지문 보기</h1>
        <p>음원을 재생하면 현재 들리는 문장이 강조됩니다.</p>
      </header>

      <section class="player-panel" aria-labelledby="trackLabel">
        <label for="trackSelect">문항</label>
        <select id="trackSelect" aria-describedby="trackStatus"></select>
        <p id="trackLabel" class="track-label"></p>
        <audio id="transcriptAudio" controls preload="metadata"></audio>
        <p id="trackStatus" class="status" aria-live="polite"></p>
      </section>

      <section class="transcript-panel" aria-label="듣기 지문">
        <ol id="transcriptLines" class="transcript-lines"></ol>
      </section>

      <section class="practice-panel" aria-labelledby="practiceTitle">
        <h2 id="practiceTitle">간이 문제 풀기</h2>
        <p class="practice-instruction">지문을 들은 뒤 답을 골라 보세요.</p>
        <div id="practiceQuestions" class="practice-questions"></div>
      </section>

      <section id="recoveryNotice" class="recovery-notice" hidden></section>
    </main>
    <script src="assets/data.js"></script>
    <script src="assets/listening-transcripts.js"></script>
  </body>
</html>
